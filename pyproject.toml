[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pm", email = "pm@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "logger>=1.4",
    "pydantic>=2.14.3",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
